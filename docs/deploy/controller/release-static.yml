# DRAFT of Werewolf-Solutions/deployment-control .github/workflows/release-static.yml
#
# This is the werewolf-static@1 release controller PSM dispatches. It holds the only
# credentials that can reach a deployment target, so it never checks out, evaluates or
# executes project code, and every value it acts on is either a dispatch input covered by
# execution_contract_digest or a file in this repository at the pinned commit.
name: PSM static release
run-name: release ${{ inputs.release_id }} to ${{ inputs.target_id }}

on:
  workflow_dispatch:
    inputs:
      psm_run_id: { required: true, type: string }
      project_id: { required: true, type: string }
      environment_id: { required: true, type: string }
      unit_id: { required: true, type: string }
      operation: { required: true, type: string }
      source_repository: { required: true, type: string }
      psm_artifact_id: { required: true, type: string }
      github_artifact_id: { required: true, type: string }
      producer_run_id: { required: true, type: string }
      payload_algorithm: { required: true, type: string }
      payload_digest: { required: true, type: string }
      archive_digest: { required: true, type: string }
      commit_sha: { required: true, type: string }
      version: { required: true, type: string }
      plan_digest: { required: true, type: string }
      plan_expires_at: { required: true, type: string }
      release_id: { required: true, type: string }
      target_id: { required: true, type: string }
      execution_contract_json: { required: true, type: string }
      execution_contract_digest: { required: true, type: string }

permissions: {}

# One release at a time per target. Never cancel: a cancelled activation leaves the
# target in a state PSM did not authorize and cannot attribute.
concurrency:
  group: psm-release-${{ inputs.target_id }}
  cancel-in-progress: false

jobs:
  # No credentials of any kind. Everything that can be rejected without touching a
  # target is rejected here, including the Environment this release is allowed to use.
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      environment: ${{ steps.verify.outputs.environment }}
      ssh_host: ${{ steps.verify.outputs.ssh_host }}
      ssh_user: ${{ steps.verify.outputs.ssh_user }}
      ssh_port: ${{ steps.verify.outputs.ssh_port }}
      host_key_fingerprint: ${{ steps.verify.outputs.host_key_fingerprint }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify the execution contract and resolve the target
        id: verify
        env:
          PSM_PSM_RUN_ID: ${{ inputs.psm_run_id }}
          PSM_PROJECT_ID: ${{ inputs.project_id }}
          PSM_ENVIRONMENT_ID: ${{ inputs.environment_id }}
          PSM_UNIT_ID: ${{ inputs.unit_id }}
          PSM_OPERATION: ${{ inputs.operation }}
          PSM_SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          PSM_PSM_ARTIFACT_ID: ${{ inputs.psm_artifact_id }}
          PSM_GITHUB_ARTIFACT_ID: ${{ inputs.github_artifact_id }}
          PSM_PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          PSM_PAYLOAD_ALGORITHM: ${{ inputs.payload_algorithm }}
          PSM_PAYLOAD_DIGEST: ${{ inputs.payload_digest }}
          PSM_ARCHIVE_DIGEST: ${{ inputs.archive_digest }}
          PSM_COMMIT_SHA: ${{ inputs.commit_sha }}
          PSM_VERSION: ${{ inputs.version }}
          PSM_PLAN_DIGEST: ${{ inputs.plan_digest }}
          PSM_PLAN_EXPIRES_AT: ${{ inputs.plan_expires_at }}
          PSM_RELEASE_ID: ${{ inputs.release_id }}
          PSM_TARGET_ID: ${{ inputs.target_id }}
          PSM_EXECUTION_CONTRACT_JSON: ${{ inputs.execution_contract_json }}
          PSM_EXECUTION_CONTRACT_DIGEST: ${{ inputs.execution_contract_digest }}
        run: python3 scripts/psm_controller.py verify

  release:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The Environment comes from this repository's target file, never from a dispatch
    # input, so a caller cannot name the Environment whose credentials it wants.
    environment: ${{ needs.contract.outputs.environment }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Actions-read on the allowed source repositories only. REPLACE the ref with the
      # full commit SHA of the reviewed release of this action before this repo exists.
      - name: Mint a short-lived source-repository token
        id: source_token
        uses: actions/create-github-app-token@REPLACE_WITH_REVIEWED_FULL_COMMIT_SHA # v2.x
        with:
          app-id: ${{ vars.PSM_ARTIFACT_READER_APP_ID }}
          private-key: ${{ secrets.PSM_ARTIFACT_READER_PRIVATE_KEY }}
          owner: ${{ needs.contract.outputs.environment && github.repository_owner }}
          repositories: ${{ inputs.source_repository }}

      - name: Download and identify the prepared artifact
        env:
          PSM_TOKEN: ${{ steps.source_token.outputs.token }}
          PSM_SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          PSM_PSM_ARTIFACT_ID: ${{ inputs.psm_artifact_id }}
          PSM_GITHUB_ARTIFACT_ID: ${{ inputs.github_artifact_id }}
          PSM_PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          PSM_ARCHIVE_DIGEST: ${{ inputs.archive_digest }}
          PSM_COMMIT_SHA: ${{ inputs.commit_sha }}
          PSM_WORK_DIR: ${{ runner.temp }}/psm-release
        run: python3 scripts/psm_controller.py fetch

      # The token is spent. Nothing after this point can read the source repository.
      - name: Discard the source-repository token
        if: always()
        env:
          PSM_TOKEN: ${{ steps.source_token.outputs.token }}
        run: |
          curl --silent --show-error --fail-with-body -X DELETE \
            -H "Authorization: Bearer $PSM_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/installation/token || true

      - name: Install the target host key and deployment key
        env:
          PSM_SSH_PRIVATE_KEY: ${{ secrets.PSM_TARGET_SSH_PRIVATE_KEY }}
          PSM_SSH_KNOWN_HOSTS: ${{ secrets.PSM_TARGET_KNOWN_HOSTS }}
          PSM_HOST_KEY_FINGERPRINT: ${{ needs.contract.outputs.host_key_fingerprint }}
          PSM_WORK_DIR: ${{ runner.temp }}/psm-release
        run: python3 scripts/psm_controller.py credentials

      - name: Stage, activate and verify the release on the target
        id: deploy
        env:
          PSM_SSH_HOST: ${{ needs.contract.outputs.ssh_host }}
          PSM_SSH_USER: ${{ needs.contract.outputs.ssh_user }}
          PSM_SSH_PORT: ${{ needs.contract.outputs.ssh_port }}
          PSM_PSM_RUN_ID: ${{ inputs.psm_run_id }}
          PSM_PROJECT_ID: ${{ inputs.project_id }}
          PSM_ENVIRONMENT_ID: ${{ inputs.environment_id }}
          PSM_UNIT_ID: ${{ inputs.unit_id }}
          PSM_SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          PSM_PSM_ARTIFACT_ID: ${{ inputs.psm_artifact_id }}
          PSM_GITHUB_ARTIFACT_ID: ${{ inputs.github_artifact_id }}
          PSM_PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          PSM_PAYLOAD_ALGORITHM: ${{ inputs.payload_algorithm }}
          PSM_PAYLOAD_DIGEST: ${{ inputs.payload_digest }}
          PSM_ARCHIVE_DIGEST: ${{ inputs.archive_digest }}
          PSM_COMMIT_SHA: ${{ inputs.commit_sha }}
          PSM_VERSION: ${{ inputs.version }}
          PSM_PLAN_DIGEST: ${{ inputs.plan_digest }}
          PSM_PLAN_EXPIRES_AT: ${{ inputs.plan_expires_at }}
          PSM_RELEASE_ID: ${{ inputs.release_id }}
          PSM_TARGET_ID: ${{ inputs.target_id }}
          PSM_EXECUTION_CONTRACT_JSON: ${{ inputs.execution_contract_json }}
          PSM_EXECUTION_CONTRACT_DIGEST: ${{ inputs.execution_contract_digest }}
          PSM_CONTROLLER_REPOSITORY: ${{ github.repository }}
          PSM_CONTROLLER_WORKFLOW: release-static.yml
          PSM_CONTROLLER_REF: ${{ github.ref }}
          PSM_CONTROLLER_COMMIT_SHA: ${{ github.sha }}
          PSM_PROVIDER_RUN_ID: ${{ github.run_id }}
          PSM_WORK_DIR: ${{ runner.temp }}/psm-release
        run: python3 scripts/psm_controller.py release

      # PSM reads exactly this artifact: one name, one file inside it. It is uploaded even
      # when the release failed, because a reported failure is how a plan ends cleanly.
      - name: Upload the release result
        if: always() && hashFiles(format('{0}/psm-release/psm-release-result.json', runner.temp)) != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.psm_run_id }}-result
          path: ${{ runner.temp }}/psm-release/psm-release-result.json
          if-no-files-found: error
          compression-level: 9
          retention-days: 30
