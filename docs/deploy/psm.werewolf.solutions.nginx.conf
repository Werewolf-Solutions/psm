# nginx vhost for psm.werewolf.solutions
#
# Install on the droplet as /etc/nginx/sites-available/psm.werewolf.solutions and
# symlink into sites-enabled. See PUBLISHING-A-NEW-APP.md for the full sequence.
#
# There is no proxy_pass and no upstream: psm's hosted half is static files. The
# two things it talks to both live elsewhere — accounts on werewolf.solutions,
# and everything about projects on the user's own machine at 127.0.0.1. If you
# find yourself adding an upstream here, the design has drifted; read
# ../hosted-psm-plan.md, which explains why there is no psm server.
#
# This replaces the landing-page vhost in werewolf-dapp/.dogfood/.

server {
    listen 80;
    listen [::]:80;
    server_name psm.werewolf.solutions;

    # certbot replaces this block with a 301 to https when it runs. Leaving the
    # ACME challenge path explicit means renewals keep working afterwards.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name psm.werewolf.solutions;

    ssl_certificate     /etc/letsencrypt/live/psm.werewolf.solutions/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/psm.werewolf.solutions/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/psm.werewolf.solutions;
    index index.html;

    access_log /var/log/nginx/psm.access.log;
    error_log  /var/log/nginx/psm.error.log;

    # psm has no build step, so — unlike todo-app — nothing here is
    # fingerprinted: app.js is app.js from one deploy to the next. Caching it
    # would serve last week's JavaScript against this week's index.html, so
    # everything revalidates and nginx answers 304 from its ETag. app.js is the
    # big one (~180 KB), hence gzip, which Ubuntu's default only applies to HTML.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    add_header Cache-Control "no-cache, must-revalidate" always;

    # The API lives on the agent, not here. Without this, a fetch that someone
    # forgot to point at the agent falls through to the SPA rule below, gets
    # index.html with HTTP 200, and dies much later inside JSON.parse. Fail loudly.
    location /api/ {
        return 404;
    }

    # SPA fallback. /auth/callback is a real route the OAuth redirect lands on and
    # it exists only in the client — without this it is a 404 and sign-in breaks
    # at the last step.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The pairing token lives in this origin's localStorage and is equivalent to
    # shell access on the user's machine, so an XSS here is remote code execution
    # there. That makes the CSP load-bearing rather than hygiene.
    #
    # web/index.html carries no inline <script> and no on*= handlers, so
    # script-src can stay strict. style-src keeps 'unsafe-inline' only because
    # app.js builds markup with innerHTML; tighten it after auditing those.
    #
    # connect-src and frame-src MUST keep the loopback entries: they are what let
    # the page reach the agent and preview a local dev server. Removing them
    # silently kills the product.
    #
    # Do NOT add upgrade-insecure-requests — it would rewrite the agent's
    # http://127.0.0.1 calls to https and break every one of them.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://werewolf.solutions http://127.0.0.1:* http://localhost:*; frame-src http://127.0.0.1:* http://localhost:*; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
}
