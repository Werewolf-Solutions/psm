name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Includes the hosted-boundary suite, which boots a real hosted server and
      # asserts that no route which shells out exists in that mode.
      - name: Test
        run: npm test

      - name: Version follows the X.Y.Z house rule
        run: npx tsx --test src/version.test.ts
